<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcount</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <!-- HOME / SETUP SCREEN -->
  <div id="screen-home" class="screen setup-screen active">
    <header class="app-header">
      <h1 class="brand-name">Flashcount</h1>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-home" aria-label="Toggle fullscreen"></button>
    </header>
    <div class="setup-body">

      <section class="setup-panel setup-panel-object">
        <h2 class="panel-title">Object</h2>
        <div class="object-grid" id="object-grid"></div>
      </section>

      <section class="setup-panel setup-panel-settings">
        <h2 class="panel-title">Settings</h2>
        <div class="settings-scroll">
          <div class="settings-block">
            <div class="settings-label">Distractors</div>
            <div class="toggle-group" id="distractor-chips">
              <button class="toggle-pill active" data-val="1">1</button>
              <button class="toggle-pill" data-val="2">2</button>
              <button class="toggle-pill" data-val="3">3</button>
              <button class="toggle-pill" data-val="4">4</button>
            </div>
          </div>
          <div class="settings-block">
            <div class="settings-label">Number range</div>
            <div class="toggle-group" id="range-chips">
              <button class="toggle-pill active" data-min="1" data-max="10">1–10</button>
              <button class="toggle-pill" data-min="10" data-max="20">10–20</button>
              <button class="toggle-pill" data-min="20" data-max="30">20–30</button>
            </div>
          </div>
          <div class="settings-block">
            <div class="settings-label">Speed</div>
            <div class="toggle-group" id="speed-chips">
              <button class="toggle-pill active" data-val="slow">Slow</button>
              <button class="toggle-pill" data-val="normal">Normal</button>
              <button class="toggle-pill" data-val="fast">Fast</button>
              <button class="toggle-pill" data-val="veryfast">Very fast</button>
            </div>
          </div>
          <div class="settings-block">
            <div class="settings-label">Style</div>
            <div class="toggle-group" id="style-chips">
              <button class="toggle-pill active" data-val="basic">Basic</button>
              <button class="toggle-pill" data-val="spread">Spread</button>
              <button class="toggle-pill" data-val="chaos">Chaos</button>
            </div>
          </div>
        </div>
        <button class="launch-btn" id="btn-start" disabled>Start</button>
      </section>

    </div>
  </div>

  <!-- PREVIEW SCREEN -->
  <div id="screen-preview" class="screen mode-screen">
    <div class="mode-topbar">
      <button class="nav-btn" onclick="showScreen('screen-home')">Home</button>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-preview" aria-label="Toggle fullscreen"></button>
    </div>
    <div class="stage">
      <div class="preview-object" id="preview-object"></div>
      <div class="preview-text" id="preview-text"></div>
    </div>
  </div>

  <!-- COUNTDOWN SCREEN -->
  <div id="screen-countdown" class="screen mode-screen">
    <div class="mode-topbar">
      <button class="nav-btn" onclick="showScreen('screen-home')">Home</button>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-countdown" aria-label="Toggle fullscreen"></button>
    </div>
    <div class="stage">
      <div class="countdown-text" id="countdown-text">Ready?</div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen mode-screen">
    <div class="mode-topbar">
      <button class="nav-btn" onclick="showScreen('screen-home')">Home</button>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-game" aria-label="Toggle fullscreen"></button>
    </div>
    <div class="stage">
      <div class="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="flash-object" id="flash-object"></div>
    </div>
  </div>

  <!-- QUESTION SCREEN -->
  <div id="screen-question" class="screen mode-screen">
    <div class="mode-topbar">
      <button class="nav-btn" onclick="showScreen('screen-home')">Home</button>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-question" aria-label="Toggle fullscreen"></button>
    </div>
    <div class="stage">
      <div class="question-object" id="question-object"></div>
      <div class="question-text" id="question-text"></div>
    </div>
    <button class="launch-btn" id="btn-show-answer">Show answer</button>
  </div>

  <!-- ANSWER SCREEN -->
  <div id="screen-answer" class="screen mode-screen">
    <div class="mode-topbar">
      <button class="nav-btn" onclick="showScreen('screen-home')">Home</button>
      <button class="nav-btn fullscreen-btn" id="fullscreen-btn-answer" aria-label="Toggle fullscreen"></button>
    </div>
    <div class="stage">
      <div class="answer-display" id="answer-display"></div>
    </div>
    <button class="launch-btn" id="btn-home">Home</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
